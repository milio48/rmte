<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMTE — Remote Terminal Relay</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <link rel="stylesheet" href="xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
</head>
<body>
    <!-- Login -->
    <div id="setup">
        <div class="setup-split">
            <!-- Left: Identity -->
            <div class="setup-brand">
                <div class="brand-content">
                    <div class="brand-badge">v0.3.1</div>
                    <div id="setup-logo">RMTE</div>
                    <p id="setup-subtitle">Encrypted remote terminal relay</p>
                    <div class="brand-features">
                        <span>AES-256 E2EE</span>
                        <span>Multi-tab terminals</span>
                        <span>File manager</span>
                        <span>Real-time collaboration</span>
                    </div>
                </div>
                <div class="brand-footer">
                    <span class="brand-dot"></span>
                    <span>Ready to connect</span>
                </div>
            </div>
            <!-- Right: Connect form -->
            <div class="setup-form">
                <div class="form-header">
                    <h2 class="form-title">Connect</h2>
                    <p class="form-desc">Enter session credentials to join</p>
                </div>
                <div class="form-fields">
                    <label class="field-label">
                        <span class="field-key">SERVER</span>
                        <input type="text" id="server" placeholder="ws://localhost:8080/ws" value="ws://localhost:8080/ws">
                    </label>
                    <label class="field-label">
                        <span class="field-key">SESSION</span>
                        <input type="text" id="sessionId" placeholder="Session ID">
                    </label>
                    <label class="field-label">
                        <span class="field-key">PASSWORD</span>
                        <input type="password" id="password" placeholder="E2E encryption key">
                    </label>
                    <label class="field-label">
                        <span class="field-key">NAME</span>
                        <input type="text" id="username" placeholder="Display name (optional)">
                    </label>
                </div>
                <button id="connect-btn" onclick="connect()">Establish Connection</button>
                <div id="setup-error" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- Main IDE -->
    <div id="terminal-container" style="display:none;">
        <div id="tabs-bar">
            <div id="tabs"></div>
            <button id="new-tab-btn" onclick="requestNewTab()" title="New Terminal">+</button>
            <button id="toggle-files-btn" onclick="toggleFileManager()" title="File Manager">📁</button>
            <button id="toggle-sidebar-btn" onclick="toggleSidebar()" title="Collaborators">👥</button>
            <button id="disconnect-btn" onclick="disconnectSession()" title="Disconnect">⏻</button>
        </div>
        <div id="workspace">
            <!-- File Explorer -->
            <div id="file-explorer">
                <div id="fe-header">
                    <span id="fe-title">EXPLORER</span>
                    <div id="fe-actions">
                        <button id="fe-new-file" onclick="showInlineInput('file')" title="New File">+📄</button>
                        <button id="fe-new-dir" onclick="showInlineInput('dir')" title="New Folder">+📁</button>
                        <label id="upload-label" title="Upload File">
                            ⬆
                            <input type="file" id="upload-input" onchange="handleFileUpload(event)" style="display:none;">
                        </label>
                        <button id="fe-refresh" onclick="requestDir(currentFilePath)" title="Refresh">⟳</button>
                    </div>
                </div>
                <div id="fe-breadcrumb" ondblclick="editBreadcrumb()"></div>
                <div id="fe-toast" style="display:none;"></div>
                <div id="fe-inline" style="display:none;"></div>
                <div id="fe-list"></div>
            </div>
            <!-- Main Area -->
            <div id="main-area">
                <div id="terminal-wrapper"></div>
            </div>
            <!-- Sidebar -->
            <div id="users-sidebar">
                <div id="users-section">
                    <h3>Collaborators</h3>
                    <div id="users-list"></div>
                </div>
                <div id="chat-section">
                    <h3>Chat</h3>
                    <div id="chat-messages"></div>
                    <div id="chat-input-container">
                        <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="handleChatKey(event)">
                        <button id="chat-send-btn" onclick="sendChatMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Status Bar -->
        <div id="status-bar">
            <span id="sb-connection">● Connected</span>
            <span id="sb-session"></span>
            <span id="sb-user"></span>
        </div>
    </div>
    <!-- Crypto: asmcrypto fallback for HTTP (non-secure context) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/asmCrypto/2.3.2/asmcrypto.all.es5.min.js"></script>
    <script src="crypto_shim.js"></script>
    <script src="xterm.js"></script>
</body>
</html>
